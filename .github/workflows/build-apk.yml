name: Build Android APK

# Triggered manually from the GitHub Actions tab ("Run workflow" button).
on:
  workflow_dispatch:
    inputs:
      profile:
        description: "EAS build profile (preview = APK, production = AAB)"
        required: true
        default: "preview"
        type: choice
        options:
          - preview
          - production

jobs:
  build:
    name: Build APK via EAS
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies (with patches)
        run: npm install --legacy-peer-deps

      - name: Verify Expo auth
        run: eas whoami

      - name: Build APK (waits for completion)
        run: |
          eas build --platform android --profile ${{ github.event.inputs.profile || 'preview' }} --non-interactive --no-wait --json > build-submission.json
          BUILD_ID=$(jq -r '.[0].id' build-submission.json)
          echo "Build submitted: $BUILD_ID"
          echo "Track at: https://expo.dev/accounts/vhjvfcvs-team/projects/project/builds/$BUILD_ID"
          echo "$BUILD_ID" > build_id.txt

          # Wait for the build to finish (polls every 30s, up to 30 min)
          for i in $(seq 1 60); do
            STATUS=$(eas build:view "$BUILD_ID" --json 2>/dev/null | jq -r '.status')
            echo "[$i/60] Status: $STATUS"
            if [ "$STATUS" = "FINISHED" ]; then
              echo "Build finished successfully!"
              exit 0
            elif [ "$STATUS" = "ERRORED" ] || [ "$STATUS" = "CANCELED" ]; then
              echo "Build failed with status: $STATUS"
              # Print the build error details for debugging
              eas build:view "$BUILD_ID" --json | jq '{status, error: .error}'
              exit 1
            fi
            sleep 30
          done
          echo "Build timed out after 30 minutes"
          exit 1

      - name: Download APK
        run: |
          BUILD_ID=$(cat build_id.txt)
          APK_URL=$(eas build:view "$BUILD_ID" --json | jq -r '.artifacts.buildUrl')
          echo "Downloading APK from: $APK_URL"
          mkdir -p artifacts
          curl -L -o artifacts/PulseFit.apk "$APK_URL"
          ls -lh artifacts/PulseFit.apk
          # Verify it's a valid APK (ZIP file)
          file artifacts/PulseFit.apk

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: PulseFit-apk
          path: artifacts/PulseFit.apk
          retention-days: 90

      - name: Summary
        if: always()
        run: |
          BUILD_ID=$(cat build_id.txt 2>/dev/null || echo "unknown")
          echo "## APK Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Build ID: \`$BUILD_ID\`" >> $GITHUB_STEP_SUMMARY
          echo "- Build URL: https://expo.dev/accounts/vhjvfcvs-team/projects/project/builds/$BUILD_ID" >> $GITHUB_STEP_SUMMARY
          echo "- APK download: see the workflow run's artifacts section below" >> $GITHUB_STEP_SUMMARY
